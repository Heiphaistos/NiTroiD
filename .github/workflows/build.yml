name: Build & Release

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  test:
    name: Analyse & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: APK Android
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - id: version
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"
      - name: Clé de signature (si configurée)
        env:
          KEYSTORE_BASE64: ${{ secrets.NITROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nitroid.jks"
            echo "NITROID_KEYSTORE=$RUNNER_TEMP/nitroid.jks" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::Aucune clé NITROID_KEYSTORE_BASE64 : APK de test signé avec une clé de debug."
          else
            # Une clé debug change à chaque machine : la mise à jour suivante refuserait de s'installer par-dessus.
            echo "::error::Secret NITROID_KEYSTORE_BASE64 manquant : refus de publier un APK signé avec une clé debug."
            exit 1
          fi
      - name: Compilation
        env:
          NITROID_KEYSTORE_PASSWORD: ${{ secrets.NITROID_KEYSTORE_PASSWORD }}
          NITROID_KEY_ALIAS: ${{ secrets.NITROID_KEY_ALIAS }}
          NITROID_KEY_PASSWORD: ${{ secrets.NITROID_KEY_PASSWORD }}
        run: |
          # Universel limité à ARM : aucun téléphone x86 récent, et ~20 Mo de moins à télécharger.
          flutter build apk --release --target-platform android-arm,android-arm64
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/NiTroiD-${{ steps.version.outputs.version }}-android.apk"
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/NiTroiD-${{ steps.version.outputs.version }}-android-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/NiTroiD-${{ steps.version.outputs.version }}-android-armv7.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  ios:
    name: IPA iOS (non signée)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Compilation
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          flutter build ios --release --no-codesign
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qr "NiTroiD-${VERSION}-ios-unsigned.ipa" Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa

  release:
    name: Publication GitHub
    needs: [android, ios]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        name: Nouvelle version ?
        run: |
          TAG="v${{ needs.android.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.exists == 'false' || startsWith(github.ref, 'refs/tags/')
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.exists == 'false' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NiTroiD ${{ steps.check.outputs.tag }}
          make_latest: true
          body_path: RELEASE_NOTES.md
          files: dist/*
